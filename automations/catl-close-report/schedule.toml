kind = "heartbeat"
name = "宁德时代收盘图｜十日分时成交量与均价"
rrule = "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=15;BYMINUTE=40;BYSECOND=0"
status = "ACTIVE"
timezone = "Asia/Shanghai"
prompt = "每个沪深实际交易日北京时间15:40，在当前对话发送一张宁德时代（300750.SZ）最近10个实际交易日的一分钟成交量图，以及一个10日市场成交均价。\n\n先把触发UTC转Asia/Shanghai，按沪深官方开休市日历核验对应原定日期。休市/周末静默；不得因迟到把下一天未收盘数据混入。每个目标交易日仅发送一次，先查该日期是否已实际发过（仅生成文件不视为发送）。必须使用目标日15:00及最终收盘数据，未收盘不能提前生成。\n工作目录 本备份目录（含 scripts/ 子目录）。遵守AGENTS.md，不使用iFinD。优先运行：.venv/bin/python scripts/catl_close_volume.py --date YYYY-MM-DD（用对应交易日替换参数）。在 research/宁德收盘图报/YYYY-MM-DD/ 保存并展示图和原始数据，滚动维护分钟档案。图按交易日顺序展示十行同尺度分钟量柱（单位手或万手，1手=100股；午休压缩），每行注明日期、当日涨跌幅、开盘、最高、最低、收盘价（不复权成交价）及日成交量，日内最大量柱高亮。优先完整真实1分钟数据、扣除午休重复时点；不得把多分钟、日线、累计量或零填充伪装成一分钟真实成交。交叉核对证券、日期、盘终时点、OHLC及分钟量合计与对应日成交量（允许日线显示舍入）。发生停牌、无成交、数据缺失或不一致，换源核实；仍不能核实则在当天缺项处标明，不能以0或旧日补画。如果日线不足10个交易日或量额单位不可靠，不报伪精确均价。\n\n10日平均成本估算口径=同一10个实际交易日总成交额（元）÷总成交股数（股）；以元/股显示两位小数，称“10日市场成交均价（市场成交成本参考）”。不是10个收盘价/日均价的简单平均，不代表个人券商成本或存量持有人真实成本。若窗口发生拆并股或除权除息需说明实际成交价格口径的可比性。最终给用户一张可直接查看的本地图、均价值和日期范围；可附分钟CSV。每个实际交易日都发送，即使均价变化很小。仅维护本图报数据，不查询账户、生成委托或发送其他持仓报告。"
